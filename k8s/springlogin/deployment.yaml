apiVersion: apps/v1
kind: Deployment
metadata:
  name: springlogin
  namespace: default
  labels:
    app: springlogin
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: springlogin
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: springlogin
    spec:
      containers:
        - name: spring-login
          image: springlogin:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP
