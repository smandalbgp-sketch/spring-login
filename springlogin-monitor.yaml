apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: springlogin-monitor
  namespace: monitoring
  labels:
    release: kind-prometheus
spec:
  selector:
    matchLabels:
      app: springlogin
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /manage/prometheus
      interval: 15s